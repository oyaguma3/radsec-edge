# 整形・静的検査・単体の試験を行う。
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# 同じブランチで新しく push したら、古い実行は止める。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: テスト
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: 整形の確認
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt で整形されていないファイル:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: テスト
        run: go test -race -count=1 ./...

  docker:
    name: 結合の試験（Docker）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: radsecproxy のイメージのビルド
        run: docker build -t radsec-edge/radsecproxy:1.11.2-1-deb13u1 images/radsecproxy
      - name: 結合の試験
        env:
          EDGE_TEST_DOCKER: "1"
        run: |
          set -o pipefail
          go test -count=1 -v ./... | tee docker.log
          # Docker の試験は EDGE_TEST_DOCKER がないとスキップされ、テスト自体は成功してしまうので、別に確かめる。
          if grep -q -- '--- SKIP' docker.log; then
            echo "スキップされた試験があります"
            grep -- '--- SKIP' docker.log
            exit 1
          fi
