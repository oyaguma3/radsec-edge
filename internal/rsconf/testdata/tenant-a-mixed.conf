server upstream-auth {
    type udp
    host 10.0.0.10
    port 1812
    secret upsecret-123
    statusServer on
}
server upstream-acct {
    type udp
    host 10.0.0.10
    port 1813
    secret upsecret-123
    statusServer on
}

realm * {
    server upstream-auth
    accountingServer upstream-acct
}
