# radsec-edge が生成した radsecproxy の設定（テナント tenant-a）。手で書き換えない。
# 設計概要 §10.3、§24。値は検証済み。
ListenTLS *:2083
# LogLevel 2: 接続の確立・切断と証明書の拒否を出す（3 は認証ごとの行が加わる。§18.1 の V4）。
LogLevel 2

tls tenant {
    CACertificateFile  /conf/current/ca-bundle.pem
    CertificateFile    /conf/current/server.pem
    CertificateKeyFile /conf/current/server.key
    CRLCheck on
    PartialChain on
    TlsVersion TLS1_2:TLS1_3
}

rewrite nasid-tenant-a-ap-001 {
    removeVendorAttribute 32473:1
    addVendorAttribute 32473:1:'42
    removeAttribute 32
    addAttribute 32:'tenant-a-ap-001
    supplementAttribute 1:'tenant-a-ap-001
}
client tenant-a-ap-001 {
    type tls
    host 203.0.113.0/24
    host [2001:db8::]/32
    tls tenant
    certificateNameCheck off
    matchCertificateAttribute SubjectAltName:URI:/^urn:example:nas:tenant-a:ap-001$/
    rewriteIn nasid-tenant-a-ap-001
}

